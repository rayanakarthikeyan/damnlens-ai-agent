name: Extraction and integrity checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install ruff==0.14.0
      - run: npm ci --ignore-scripts
      - name: Python lint, formatting and frontend checks
        run: python scripts/check_quality.py
  test:
    needs: quality
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=reports/tests.xml
      - name: Verify judge bootstrap in a fresh virtual environment
        run: python setup_judges.py --setup-only
      - name: Judge smoke checks without network installation
        run: python setup_judges.py --judge-test --offline
      - name: Independent expected cells on pinned public PDF fixtures
        run: python scripts/public_evaluation.py --fetch
      - name: Expanded public scans, layout checkpoints and ambiguous-header review
        run: python scripts/expanded_evaluation.py --fetch --check-review-routing
      - name: Verify Windows double-click entry point
        if: runner.os == 'Windows'
        shell: cmd
        run: START_DAMNLENS.cmd --check --offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: |
            reports/tests.xml
            reports/public-evaluation-final.json
            reports/expanded-after.json
  container:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build image with excluded credential canary
        run: |
          printf 'GEMINI_API_KEY=container-exclusion-canary\n' > .env
          docker build -t damnlens-ci .
      - name: Run the image as its non-root user
        run: |
          docker run -d --name damnlens-ci -p 127.0.0.1:8765:8765 damnlens-ci
          test "$(docker exec damnlens-ci id -u)" != "0"
          docker exec damnlens-ci test ! -e /app/.env
      - name: Extract all three dummy documents through the container API
        run: python scripts/container_check.py
      - name: Container diagnostics
        if: always()
        run: docker logs damnlens-ci || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-results
          path: reports/container-check.json
      - name: Stop test container
        if: always()
        run: docker rm -f damnlens-ci || true
