name: Research API checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-research.txt pytest httpx
      - run: python -m pytest tests/test_research.py -q
      - run: docker build -f Dockerfile.research -t damnlens-research .
