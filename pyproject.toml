[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["tmp", "submission", ".jobs", "models"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI resolves this declarative dependency rather than calling it per request.
extend-immutable-calls = ["fastapi.File"]
